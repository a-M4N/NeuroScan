[project]
name = "neuroscan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "a-M4N", email = "development@teamweb.in" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "grad-cam>=1.5.5",
    "monai>=1.6.0",
    "nibabel>=5.4.2",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pydicom>=3.0.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scipy>=1.18.0",
    "sqlalchemy>=2.0.52",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "uvicorn>=0.52.3",
    "google-generativeai>=0.8.6",
    "jinja2>=3.1.6",
    "markdown>=3.6",
    "weasyprint>=60.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "tensorboard>=2.18.0,<2.22.0",
]


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyright]
extraPaths = ["."]
